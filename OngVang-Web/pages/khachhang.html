<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Khách hàng thân thiết - Golden Bee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/khachhang.css" />
    <script defer src="../js/app.js"></script>
    <script defer src="../components/sidebar.js"></script>
    <script defer src="../components/topbar.js"></script>
    <script defer src="../components/toast.js"></script>
    <script defer src="../js/khachhang.js"></script>
  </head>
  <body data-page="khachhang">
    <div class="admin-layout"><div id="sidebar"></div><main class="admin-main"><div id="topbar"></div><div class="content">
      <section class="page-intro loyalty-intro"><div><span class="eyebrow">CHĂM SÓC KHÁCH HÀNG</span><h2>Khách hàng thân thiết</h2><p>Đăng ký thẻ tự nguyện và tra cứu thành viên bằng mã thẻ.</p></div><span class="loyalty-count"><strong id="loyaltyCount">0</strong> thẻ đang quản lý</span></section>
      <div class="loyalty-layout">
        <section class="panel loyalty-register"><div class="panel-header"><div><h2>Đăng ký thẻ thành viên</h2><p>Chỉ tạo thẻ khi khách hàng đồng ý tham gia.</p></div><i class="fa-solid fa-address-card"></i></div>
          <form id="loyaltyForm" class="panel-body form-grid">
            <label class="form-group full">Họ và tên<input class="form-control" name="name" maxlength="200" required /></label>
            <label class="form-group full">Số điện thoại<input class="form-control" name="phone" type="tel" maxlength="20" /></label>
            <label class="form-group full">Email<input class="form-control" name="email" type="email" maxlength="200" /></label>
            <label class="form-group full">Địa chỉ<input class="form-control" name="address" maxlength="300" /></label>
            <button id="loyaltySubmit" class="btn btn-primary full" type="submit"><i class="fa-solid fa-user-plus"></i> Đăng ký và tạo mã</button>
            <div id="loyaltyCreated" class="loyalty-created full" aria-live="polite" hidden></div>
          </form>
        </section>
        <section class="panel loyalty-list"><div class="panel-header"><div><h2>Danh sách thẻ</h2><p>Mã thẻ có dạng hai chữ cái và mười chữ số.</p></div></div><div class="panel-body">
          <div class="toolbar-row"><input id="loyaltySearch" class="form-control" type="search" placeholder="Tìm tên, số điện thoại hoặc mã thẻ..." /></div>
          <div class="table-wrap"><table><thead><tr><th>Mã thành viên</th><th>Khách hàng</th><th>Điện thoại</th><th>Hạng</th><th>Điểm</th></tr></thead><tbody id="loyaltyList"></tbody></table></div>
        </div></section>
      </div>
    </div></main></div>
  </body>
</html>
