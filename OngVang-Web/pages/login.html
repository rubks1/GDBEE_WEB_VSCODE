<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Golden Bee Restaurant</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/login.css" />
    <script defer src="../js/app.js"></script>
    <script defer src="../js/login.js"></script>
  </head>
  <body class="login-page">
    <div class="login-shell">
      <div class="login-visual">
        <div class="visual-card">
          <div class="brand-mark">GB</div>
          <h2>Golden Bee</h2>
          <p>Quản lý nhà hàng hiện đại, nhanh chóng và tiện lợi cho nhân viên, quản lý và khách hàng.</p>
        </div>
      </div>

      <form class="login-card" id="loginForm" novalidate>
        <div class="login-brand">
          <span class="brand-mark">GB</span>
          <strong>Golden Bee Restaurant</strong>
        </div>

        <h1>Đăng nhập</h1>
        <p>Truy cập hệ thống quản trị nhà hàng.</p>

        <div class="alert alert-danger hidden" id="loginError"></div>

        <div class="form-group">
          <label for="username">Tên đăng nhập</label>
          <input class="form-control" id="username" name="username" autocomplete="username" placeholder="Nhập tên đăng nhập" required />
        </div>

        <div class="form-group">
          <label for="password">Mật khẩu</label>
          <div class="password-field">
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu" required />
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Hiện mật khẩu">Hiện</button>
          </div>
        </div>

        <div class="inline-row">
          <label><input type="checkbox" name="remember" /> Ghi nhớ</label>
          <a href="#">Quên mật khẩu?</a>
        </div>

        <button class="btn btn-primary" id="loginButton" type="submit">Đăng nhập</button>

        <div class="demo-accounts">
          <strong>Tài khoản nhân viên</strong><br />
          Đăng nhập bằng tài khoản được quản lý trong hệ thống.
        </div>
      </form>
    </div>
  </body>
</html>
