<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Danh mục nhà hàng - Golden Bee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/quanly.css" />
    <script defer src="../js/app.js"></script>
    <script defer src="../components/sidebar.js"></script>
    <script defer src="../components/topbar.js"></script>
    <script defer src="../components/modal.js"></script>
    <script defer src="../components/toast.js"></script>
    <script defer src="../components/loading.js"></script>
    <script defer src="../js/quanly.js"></script>
  </head>
  <body data-page="quanly">
    <div class="admin-layout">
      <div id="sidebar"></div>
      <main class="admin-main">
        <div id="topbar"></div>
        <div class="content">
          <section class="page-intro catalog-intro">
            <div><span class="eyebrow">DỮ LIỆU NHÀ HÀNG</span><h2>Danh mục nhà hàng</h2><p>Quản lý thực đơn, bàn và voucher của nhà hàng.</p></div>
            <button id="addRegistryButton" class="btn btn-primary" type="button"><i class="fa-solid fa-plus"></i> Thêm mục</button>
          </section>

          <section class="registry-overview" aria-label="Tổng quan danh mục">
            <div><i class="fa-solid fa-utensils"></i><span><strong id="foodCount">0</strong><small>Món ăn & đồ uống</small></span></div>
            <div><i class="fa-solid fa-chair"></i><span><strong id="tableCount">0</strong><small>Bàn</small></span></div>
            <div><i class="fa-solid fa-ticket"></i><span><strong id="voucherCount">0</strong><small>Voucher</small></span></div>
          </section>

          <section class="panel">
            <div class="panel-header">
              <div><h2>Tất cả mục</h2><p><span id="registryCount">0</span> bản ghi vận hành</p></div>
            </div>
            <div class="panel-body">
              <div class="toolbar-row">
                <input id="registrySearch" class="form-control" type="search" placeholder="Tìm mã hoặc tên..." />
                <select id="registryTypeFilter" class="form-control slim" aria-label="Lọc loại dữ liệu">
                  <option>Tất cả</option>
                  <option>Món ăn</option>
                  <option>Đồ uống</option>
                  <option>Bàn</option>
                  <option>Voucher</option>
                </select>
              </div>
              <div class="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Mã</th>
                      <th>Tên</th>
                      <th>Loại</th>
                      <th>Trạng thái</th>
                      <th>Thao tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>#MN-01</td>
                      <td>Phở bò</td>
                      <td>Món ăn</td>
                      <td><span class="tag success">Hoạt động</span></td>
                      <td><button class="small-btn" type="button">Sửa</button></td>
                    </tr>
                    <tr>
                      <td>#NV-03</td>
                      <td>Nguyễn Văn A</td>
                      <td>Nhân viên</td>
                      <td><span class="tag info">Đang làm</span></td>
                      <td><button class="small-btn" type="button">Sửa</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>
  </body>
</html>
