<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gọi món - Golden Bee</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/hoadon.css" />
    <script defer src="../js/app.js"></script>
    <script defer src="../components/sidebar.js"></script>
    <script defer src="../components/topbar.js"></script>
    <script defer src="../components/modal.js"></script>
    <script defer src="../components/toast.js"></script>
    <script defer src="../components/loading.js"></script>
    <script defer src="../js/hoadon.js"></script>
  </head>
  <body data-page="hoadon">
    <div class="admin-layout">
      <div id="sidebar"></div>
      <main class="admin-main">
        <div id="topbar"></div>
        <div class="content">
          <section class="pos-heading">
            <div><span class="eyebrow">ĐIỂM BÁN HÀNG</span><h2>Tạo đơn hàng</h2><p>Chọn món, thêm thông tin bàn và hoàn tất thanh toán.</p></div>
            <span class="pos-open-status"><i></i> Quầy đang mở</span>
          </section>

          <div class="pos-workspace">
            <section class="panel menu-panel">
              <div class="panel-header">
                <div><h2>Thực đơn</h2><p>Món đang phục vụ hôm nay</p></div>
                <label class="menu-search"><i class="fa-solid fa-magnifying-glass"></i><input id="menuSearch" type="search" placeholder="Tìm món..." /></label>
              </div>
              <div class="panel-body">
                <div class="menu-categories" id="menuCategories" role="group" aria-label="Lọc danh mục món">
                  <button class="active" type="button" data-category="Tất cả">Tất cả</button>
                  <button type="button" data-category="Món ăn">Món ăn</button>
                  <button type="button" data-category="Đồ uống">Đồ uống</button>
                </div>
                <div class="menu-list" id="menuList">
                </div>
              </div>
            </section>

            <section class="panel pos-cart">
              <div class="panel-header">
                <div><h2>Đơn hiện tại</h2><p><span id="cartItemCount">0</span> món trong giỏ</p></div>
                <button id="clearCart" class="text-button" type="button">Xóa giỏ</button>
              </div>
              <div class="panel-body cart-box">
                <div class="checkout-grid">
                  <label class="checkout-field">Loại đơn<select id="invoiceOrderType" class="form-control"><option>Dùng tại bàn</option><option>Mang đi</option></select></label>
                  <label class="checkout-field">Bàn<select id="invoiceTable" class="form-control"><option value="">Đang tải bàn...</option></select></label>
                </div>
                <div class="checkout-booking-field">
                  <label class="checkout-field">Đặt bàn<select id="invoiceBooking" class="form-control"><option value="">Không dùng đặt bàn có sẵn</option></select></label>
                  <button id="createBookingForInvoice" class="text-button" type="button">Đặt bàn mới</button>
                </div>
                <label class="checkout-field">Khách hàng<input id="invoiceCustomer" class="form-control" type="text" value="Khách lẻ" list="invoiceCustomerOptions" /><datalist id="invoiceCustomerOptions"></datalist></label>
                <label class="checkout-field">Mã thành viên (không bắt buộc)<input id="invoiceLoyaltyCode" class="form-control" type="text" maxlength="13" placeholder="VD: AB-0123456789" autocomplete="off" /><small id="invoiceLoyaltyMessage" aria-live="polite"></small></label>
                <div id="cartItems" class="cart-items"></div>
                <div class="voucher-entry">
                  <label class="checkout-field" for="invoiceVoucherCode">Mã voucher</label>
                  <div class="voucher-input-row"><input id="invoiceVoucherCode" class="form-control" type="text" maxlength="30" placeholder="Nhập mã giảm giá" /><button id="applyInvoiceVoucher" class="btn btn-secondary" type="button">Áp dụng</button></div>
                  <small id="invoiceVoucherMessage" aria-live="polite"></small>
                </div>
                <label class="checkout-field payment-field">Phương thức thanh toán<select id="invoicePaymentMethod" class="form-control"><option>Tiền mặt</option><option>Chuyển khoản</option><option>Thẻ</option></select></label>
                <label class="checkout-field">Trạng thái hóa đơn<select id="invoicePaymentStatus" class="form-control"><option value="paid">Thanh toán ngay</option><option value="pending">Chờ thanh toán</option></select></label>
                <div class="cart-row"><span>Tạm tính</span><strong id="cartSubtotal">0đ</strong></div>
                <div class="cart-row discount-row"><span>Giảm giá</span><strong id="cartDiscount">0đ</strong></div>
                <div class="cart-row total-row"><span>Tổng thanh toán</span><strong id="cartTotal">0đ</strong></div>
                <button id="invoiceCheckout" class="btn btn-primary" type="button"><i class="fa-solid fa-file-invoice"></i> Tạo hóa đơn</button>
                <small class="checkout-footnote"><i class="fa-solid fa-shield-halved"></i> Giao dịch sẽ được lưu vào danh sách hóa đơn.</small>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
